name: Prism IA CI

on:
  push:
    branches:
      - main
      - 'prism-*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Validate backend
        run: npm run check
      - name: Build frontend
        run: npm run build
